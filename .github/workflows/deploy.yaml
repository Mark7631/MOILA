name: CI/CD
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
          docker compose --version
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/moila-frontend:latest
          build-args: |
            VITE_API_BASE=${{secrets.VITE_API_BASE}}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/moila-backend:latest
      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: proxy/Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/moila-proxy:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Run deployment tests
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
        run: |
          docker-compose --env-file .env.test up -d
          sleep 30
          for service in backend frontend proxy; do
            if ! docker-compose -f compose.yaml ps --services --filter "status=running" | grep -q "^${service}$"; then
              echo "Error: ${service} container is not running"
              docker-compose -f compose.yaml logs ${service}
              docker-compose -f compose.yaml down --volumes
              exit 1
            fi
          done
          curl -f http://localhost:80 || {
            echo "Error: Proxy HTTP endpoint not accessible"
            docker-compose -f compose.yaml logs proxy
            docker-compose -f compose.yaml down --volumes
            exit 1
          }
          docker-compose -f compose.yaml down --volumes